  .vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.55) 100%);
  }

  .title-container {
    position: absolute;
    bottom: 7.5%; left: 0;
    width: 100%;
    padding: 0 30px;
    text-align: center;
    z-index: 3;
    opacity: 0;
    transform: translateY(30px);
    animation: title-appear 2s var(--ease-cine) 9s forwards;
  }
  .title-container h1 {
    color: #fff;
    font-size: clamp(22px, 6.2vw, 28px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: .01em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
    margin-bottom: 8px;
  }
  .title-container p {
    color: #d6d6d6;
