<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облёт ЖК по дуге</title>
  <style>
    :root {
      --ease-cine: cubic-bezier(.37, 0, .28, 1);
      --duration: 9s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0e0e0e;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .scene-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 800px;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      background-color: #000;
      perspective: 1200px;
    }

    /* Фото ЖК — «камера» огибает дом по дуге слева направо */
    .building-bg {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: url('assets/building.jpg') center 35%/cover no-repeat;
      transform-origin: 50% 45%;
      animation: orbit-arc var(--duration) var(--ease-cine) infinite alternate;
      will-change: transform;
    }

    /* Облёт по дуге: старт слева с разворотом камеры,
       подъём к вершине дуги по центру и уход вправо */
    @keyframes orbit-arc {
      0% {
        transform: rotateY(-10deg) scale(1.26) translate(9%, 3%);
      }
      50% {
        transform: rotateY(0deg) scale(1.20) translate(0%, -5%);
      }
      100% {
        transform: rotateY(10deg) scale(1.26) translate(-9%, 3%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .building-bg {
        animation: none;
        transform: scale(1.2) translate(0, -5%);
      }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="building-bg"></div>
  </div>

</body>
</html>
